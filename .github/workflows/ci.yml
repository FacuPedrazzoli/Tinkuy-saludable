name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tinkuy/package-lock.json
      - name: Install dependencies
        working-directory: ./tinkuy
        run: npm ci
      - name: Run ESLint
        working-directory: ./tinkuy
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tinkuy/package-lock.json
      - name: Install dependencies
        working-directory: ./tinkuy
        run: npm ci
      - name: Run TypeScript type check
        working-directory: ./tinkuy
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tinkuy/package-lock.json
      - name: Install dependencies
        working-directory: ./tinkuy
        run: npm ci
      - name: Install Playwright
        working-directory: ./tinkuy
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        working-directory: ./tinkuy
        run: npm test || echo "No tests configured"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tinkuy/package-lock.json
      - name: Install dependencies
        working-directory: ./tinkuy
        run: npm ci
      - name: Build
        working-directory: ./tinkuy
        run: npm run build
